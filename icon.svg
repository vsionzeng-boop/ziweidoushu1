  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- 命盘方格 -->
  <g fill="none" stroke="#c8a34a" stroke-width="10" opacity="0.9">
    <rect x="252" y="252" width="520" height="520" rx="24"/>
    <line x1="382" y1="252" x2="382" y2="772"/>
    <line x1="642" y1="252" x2="642" y2="772"/>
